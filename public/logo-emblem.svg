<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" width="300" height="340">
  <!-- EAGLE EYE - Standalone Brand Emblem -->
  <!-- Primary Color Palette: Matte Black (#121212), Charcoal (#222222), Warm Gold (#B08D57), White (#FFFFFF) -->
  
  <g id="shield-emblem">
    <!-- Outer Shield Crest Outer Line -->
    <path d="M 150 14 C 230 14 275 42 282 124 C 282 205 218 266 150 300 C 82 266 18 205 18 124 C 25 42 70 14 150 14 Z" 
          fill="#121212" stroke="#B08D57" stroke-width="5" stroke-linejoin="round"/>
          
    <!-- Inner Shield Gold Contour Frame -->
    <path d="M 150 28 C 218 28 258 52 264 122 C 264 192 208 246 150 276 C 92 246 36 192 36 122 C 42 52 82 28 150 28 Z" 
          fill="#222222" stroke="#B08D57" stroke-width="2" stroke-opacity="0.6"/>
  </g>

  <!-- Eagle Head & Magnifying Glass Group -->
  <g id="eagle-identity" transform="translate(0, 5)">
    <!-- Eagle Back Head & Crown Feathers (Matte Black / Charcoal Silhouette) -->
    <path d="M 92 110 C 98 80 120 62 152 62 C 182 62 206 78 214 96 C 220 110 216 124 210 134 C 204 144 194 150 188 154 L 180 142 L 188 132 C 194 124 196 114 192 104 C 186 92 172 82 152 82 C 130 82 114 96 110 114 Z" 
          fill="#FFFFFF" />

    <!-- Eagle Neck Feather Base Layer -->
    <path d="M 86 124 C 84 100 98 72 134 60 C 168 48 204 62 222 88 C 232 102 234 122 226 140 L 216 132 C 222 120 220 106 212 96 C 198 76 170 64 138 72 C 110 80 98 100 98 120 C 98 140 108 160 118 174 L 108 180 C 94 162 86 142 86 124 Z" 
          fill="#B08D57"/>

    <!-- Crisp White Eagle Head Solid Base Body -->
    <path d="M 125 78 C 145 68 175 70 196 86 C 215 101 224 124 218 148 C 212 168 198 188 178 206 C 164 218 154 226 150 234 C 146 226 136 218 122 206 C 102 188 88 168 82 148 C 78 132 82 116 90 102 C 100 86 112 80 125 78 Z" 
          fill="#FFFFFF"/>

    <!-- Sharp Beak Structure (Warm Gold) -->
    <path d="M 174 126 C 188 122 206 122 220 128 C 234 134 246 146 250 162 C 238 172 224 176 208 170 C 196 166 186 156 180 144 C 176 138 174 132 174 126 Z" 
          fill="#B08D57"/>
    <!-- Beak Hook Detail Cutout -->
    <path d="M 220 128 C 235 134 248 148 250 162 C 238 168 226 168 214 162 C 224 154 224 142 220 128 Z" 
          fill="#121212" opacity="0.2"/>

    <!-- Beak Mouth Line Separator -->
    <path d="M 180 144 Q 210 148 242 160" stroke="#121212" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Eagle Eye Brow Crease & Shadow Contour -->
    <path d="M 128 114 C 140 104 162 104 176 112 L 184 122 C 172 118 155 116 138 124 Z" 
          fill="#121212"/>

    <!-- Fierce Intelligent Eagle Eye -->
    <ellipse cx="156" cy="126" rx="9" ry="7" fill="#121212"/>
    <ellipse cx="156" cy="126" rx="6" ry="4.5" fill="#B08D57"/>
    <circle cx="156" cy="126" r="3" fill="#121212"/>
    <circle cx="154.5" cy="124.5" r="1" fill="#FFFFFF"/>

    <!-- Integrated Magnifying Glass (Positioned over Eagle Eye) -->
    <!-- Handle (45 degree angle down to left) -->
    <rect x="94" y="162" width="14" height="52" rx="4" 
          fill="#B08D57" transform="rotate(40 94 162)" stroke="#121212" stroke-width="3"/>
    <rect x="98" y="166" width="6" height="44" rx="2" 
          fill="#121212" opacity="0.3" transform="rotate(40 94 162)"/>
    <!-- Handle Metallic Cap Collar -->
    <rect x="115" y="142" width="18" height="8" rx="2" 
          fill="#B08D57" transform="rotate(40 115 142)" stroke="#121212" stroke-width="2"/>

    <!-- Lens Outer Rim (Gold Ring) -->
    <circle cx="156" cy="126" r="36" fill="none" stroke="#B08D57" stroke-width="6"/>
    <!-- Lens Inner Contour Ring (Matte Black Accent Border) -->
    <circle cx="156" cy="126" r="39" fill="none" stroke="#121212" stroke-width="2"/>
    <circle cx="156" cy="126" r="33" fill="none" stroke="#121212" stroke-width="2"/>

    <!-- Lens Subtle Glass Reflection Line (White Accent Cut) -->
    <path d="M 134 104 A 33 33 0 0 1 176 102" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Bottom Crest Accent Ribbon / Star Motif -->
  <g id="crest-accent" transform="translate(150, 276)">
    <polygon points="0,-12 4,-3 12,-3 6,2 8,10 0,5 -8,10 -6,2 -12,-3 -4,-3" fill="#B08D57"/>
  </g>
</svg>
