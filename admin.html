<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Operations Center - Anveshak</title>
  <link rel="stylesheet" href="/src/styles/main.css">
  <style>
    body {
      background-color: var(--bg-primary, #0A101D);
      color: var(--text-main, #F0F4F8);
      padding: 40px 20px;
      font-family: var(--font-body);
      min-height: 100vh;
    }
    
    /* Login Overlay */
    #login-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(6, 10, 18, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .login-box {
      background: #10192A;
      border: 1px solid rgba(197, 160, 89, 0.35);
      padding: 50px 40px;
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 30px rgba(197, 160, 89, 0.15);
      text-align: center;
      width: 100%;
      max-width: 420px;
    }
    .login-box h2 {
      color: var(--text-main);
      margin-bottom: 5px;
      font-family: var(--font-heading);
      font-size: 26px;
    }
    .form-input {
      width: 100%;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background-color: #16233B;
      color: var(--text-main);
      border-radius: var(--radius-sm);
      font-size: 15px;
      margin-bottom: 20px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .form-input:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.25);
    }
    
    /* Admin Container */
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      background: #10192A;
      border: 1px solid rgba(197, 160, 89, 0.3);
      border-radius: var(--radius-lg);
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      display: none; /* Hidden until login */
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 20px;
    }
    .admin-header h1 {
      color: var(--text-main);
      font-size: 32px;
      margin: 0;
      font-family: var(--font-heading);
    }
    
    /* Table Styles */
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 8px;
      font-size: 15px;
    }
    th, td {
      padding: 18px 20px;
      text-align: left;
    }
    th {
      color: #DFBF7D;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 12px;
      font-weight: 600;
      border-bottom: 1px solid rgba(197, 160, 89, 0.25);
    }
    tr {
      background: #16233B;
      transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
    }
    tr:hover {
      transform: translateY(-2px);
      background: #192742;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
    }
    tr td:first-child { border-top-left-radius: var(--radius-md); border-bottom-left-radius: var(--radius-md); }
    tr td:last-child { border-top-right-radius: var(--radius-md); border-bottom-right-radius: var(--radius-md); }
    
    /* Interactive Elements */
    .status-select {
      background: #10192A;
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }
    .status-select:focus { border-color: var(--accent-gold); }
    .status-select option { background: #10192A; color: #F0F4F8; }
    .status-Pending { color: #F59E0B; border-color: rgba(245, 158, 11, 0.4); background: rgba(245, 158, 11, 0.12); }
    .status-Contacted { color: #38BDF8; border-color: rgba(56, 189, 248, 0.4); background: rgba(56, 189, 248, 0.12); }
    .status-Closed { color: #34D399; border-color: rgba(52, 211, 153, 0.4); background: rgba(52, 211, 153, 0.12); }
    
    .desc-toggle {
      color: var(--accent-gold);
      cursor: pointer;
      font-size: 13px;
      text-decoration: none;
      font-weight: 600;
      background: none;
      border: none;
      padding: 0;
      margin-top: 5px;
    }
    .desc-toggle:hover { text-decoration: underline; color: var(--accent-gold-hover); }
    .desc-content {
      display: none;
      margin-top: 10px;
      padding: 15px;
      background: #0E1626;
      border-radius: var(--radius-sm);
      font-size: 14px;
      color: var(--text-secondary);
      border-left: 3px solid var(--accent-gold);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <!-- Secure Login -->
  <div id="login-overlay">
    <div class="login-box">
      <h2>Agency Portal</h2>
      <p style="font-size: 14px; color: var(--text-secondary); margin-bottom: 30px;">Authorized personnel only.</p>
      <input type="password" id="admin-pass" class="form-input" placeholder="Enter Access Code" style="text-align: center;">
      <button id="login-btn" class="btn btn-primary" style="width: 100%;">Authenticate</button>
      <p id="login-error" style="color: #f87171; font-size: 13px; margin-top: 15px; display: none;">Invalid clearance code.</p>
    </div>
  </div>

  <div class="admin-container" id="admin-panel">
    <div class="admin-header">
      <h1>Operations Center</h1>
      <div>
        <button id="enable-notifications" class="btn btn-primary">
          Enable Desktop Alerts
        </button>
      </div>
    </div>

    <table id="requests-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Client Identity</th>
          <th>Contact Info</th>
          <th>Target Service</th>
          <th>Status Update</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <!-- Data populated by JS -->
      </tbody>
    </table>
    <div id="empty-state" class="empty-state" style="display: none; text-align: center; padding: 60px;">
      <svg style="width:48px; height:48px; color:var(--accent-gold); margin-bottom:20px; opacity: 0.5;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <div style="color: var(--text-secondary); font-size: 16px;">No active investigations found. Monitoring network...</div>
    </div>
  </div>

  <script type="module" src="/src/js/admin.js"></script>
</body>
</html>
